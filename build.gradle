plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

// build.gradle
bootRun {
    jvmArgs = [
        "-javaagent:./opentelemetry-javaagent.jar"
    ]
}

group = 'openTelemetry'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()

    // JitPack repository for JMeter plugins
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing - MOVED TO TOP TO ENSURE PRIORITY
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // Explicitly add JUnit Jupiter API to ensure it's available
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // OpenTelemetry core
    implementation platform('io.opentelemetry:opentelemetry-bom:1.53.0')
    implementation("io.opentelemetry:opentelemetry-api")
    implementation("io.opentelemetry:opentelemetry-sdk")

    implementation("io.opentelemetry:opentelemetry-exporter-otlp")
    implementation("io.opentelemetry.semconv:opentelemetry-semconv:1.26.0-alpha")

    // logs
    implementation 'org.slf4j:jul-to-slf4j:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.15'
    implementation 'ch.qos.logback:logback-core:1.5.15'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.11.0-alpha'

    // jmeter dsl
    testImplementation("us.abstracta.jmeter:jmeter-java-dsl:1.30") {
        exclude group: "org.apache.jmeter", module: "bom"
        exclude group: "junit", module: "junit"
        exclude group: "org.junit.vintage", module: "junit-vintage-engine"
    }

    testImplementation('us.abstracta.jmeter:jmeter-java-dsl-blazemeter:1.30') {
        exclude group: "junit", module: "junit"
        exclude group: "org.junit.vintage", module: "junit-vintage-engine"
    }

    testImplementation "org.apache.jmeter:ApacheJMeter_http:5.6.3"
    testImplementation "org.apache.jmeter:ApacheJMeter_core:5.6.3"
    testImplementation "org.apache.jmeter:ApacheJMeter_components:5.6.3"
    testImplementation "org.apache.jmeter:ApacheJMeter_config:5.6.3"
    testImplementation "org.apache.jmeter:ApacheJMeter_functions:5.6.3"
    testImplementation "org.apache.jmeter:ApacheJMeter_java:5.6.3"
    testImplementation "kg.apc:jmeter-plugins-casutg:2.10"

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation("org.springframework.boot:spring-boot-starter-actuator")

    testImplementation 'us.abstracta.jmeter:jmeter-java-dsl-prometheus:1.30'
}

tasks.named('test') {
    useJUnitPlatform()
}