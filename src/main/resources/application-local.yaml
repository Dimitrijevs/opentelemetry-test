spring:
  datasource:
    url: jdbc:postgresql://localhost:5444/products
    username: products_username
    password: products_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8100

otel:
  service:
    name: products-service
  traces:
    exporter: otlp
  metrics: 
    exporter: otlp
  exporter:
    otlp:
      endpoint: "http://localhost:4317"
      protocol: grpc
  metric:
    export:
      interval: 15s

management:
  metrics:
    tags:
      application: products
  endpoints:
    web:
      exposure:
        include: "*"