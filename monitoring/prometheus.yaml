global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: "otel-collector"
    static_configs:
      - targets: ["ht-otel-collector:9464"]

  - job_name: "products-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8100"]

  - job_name: "jmeter"
    static_configs:
      - targets: ["host.docker.internal:9270"] # Default port for JMeter Prometheus listener
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/metrics"
